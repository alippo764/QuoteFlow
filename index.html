                                            {profile.accountName && <p><span className="font-semibold text-gray-500 w-24 inline-block">Account Name:</span> {profile.accountName}</p>}
                                            {profile.accountNumber && <p><span className="font-semibold text-gray-500 w-24 inline-block">Account No:</span> <span className="font-mono text-base">{profile.accountNumber}</span></p>}
                                        </div>
                                    ) : (
                                        <p className="text-gray-400 italic text-sm">No bank details provided in profile.</p>
                                    )}
                                </div>

                                {/* Signatures */}
                                <div className="w-full sm:w-1/2 flex justify-end gap-12 text-sm text-center">
                                    {/* Company Signature */}
                                    <div className="w-40 flex flex-col items-center">
                                        <div className="h-20 border-b border-gray-400 w-full mb-2"></div>
                                        <p className="font-bold text-gray-900">{profile.businessName || 'Company'}</p>
                                        <p className="text-gray-500 text-xs mt-1">Authorized Signature</p>
                                    </div>
                                    
                                    {/* Customer Acceptance (Only for Quotations) */}
                                    {!isInvoice && (
                                        <div className="w-40 flex flex-col items-center">
                                            <div className="h-20 border-b border-gray-400 w-full mb-2"></div>
                                            <p className="font-bold text-gray-900">{customer?.name || 'Customer'}</p>
                                            <p className="text-gray-500 text-xs mt-1">Accepted & Signed</p>
                                            <p className="text-gray-500 text-xs mt-1 border-t border-gray-200 pt-1 w-full text-left">Date:</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [data, setData] = useState(INITIAL_STATE);
            const [activeItem, setActiveItem] = useState(null); // For editing/previewing
            const [toastMessage, setToastMessage] = useState('');
            const [toastType, setToastType] = useState('success');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Load from LocalStorage
            useEffect(() => {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (storedData) {
                    try {
                        setData(JSON.parse(storedData));
                    } catch (e) {
                        console.error("Failed to parse stored data", e);
                    }
                }
            }, []);

            // Helper to update specific slice of data and persist
            const updateData = (key, value) => {
                setData(prev => {
                    const newData = { ...prev, [key]: value };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
                    return newData;
                });
            };

            const showToast = (msg, type = 'success') => {
                setToastMessage(msg);
                setToastType(type);
            };

            const navigate = (newView) => {
                setView(newView);
                setActiveItem(null); // Reset active item on main navigation
                setIsMobileMenuOpen(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Mobile Navigation Items
            const navItems = [
                { id: 'dashboard', icon: 'fa-house', label: 'Home' },
                { id: 'quotations', icon: 'fa-file-lines', label: 'Quotations' },
                { id: 'invoices', icon: 'fa-file-invoice', label: 'Invoices' }
            ];

            return (
                <div className="min-h-screen bg-[#f8fafc] text-slate-900 font-sans flex flex-col">
                    
                    {/* Desktop Navigation */}
                    <nav className="hidden md:block bg-white border-b border-slate-200 sticky top-0 z-50 no-print shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center cursor-pointer" onClick={() => navigate('dashboard')}>
                                    <AppLogo />
                                </div>
                                <div className="flex items-center space-x-1 sm:space-x-4">
                                    {navItems.map(item => (
                                        <button 
                                            key={item.id} 
                                            onClick={() => navigate(item.id)}
                                            className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${view === item.id || (view.startsWith(item.id.replace('s','')) && item.id !== 'dashboard') ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                    <div className="w-px h-6 bg-slate-200 mx-2"></div>
                                    <button onClick={() => navigate('customers')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${view === 'customers' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}>Customers</button>
                                    <button onClick={() => navigate('profile')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${view === 'profile' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}>Profile</button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Mobile Header */}
                    <header className="md:hidden bg-white border-b border-slate-200 sticky top-0 z-40 no-print shadow-sm">
                        <div className="px-4 h-14 flex items-center justify-between">
                            <AppLogo />
                            <div className="w-8"></div> {/* Spacer for centering if needed, or empty */}
                        </div>
                    </header>

                    {/* Main Content Area - Flexible height to push footer down */}
                    <main className="flex-grow relative">
                        {view === 'dashboard' && <Dashboard data={data} setView={navigate} setActiveItem={setActiveItem} />}
                        
                        {view === 'customers' && <Customers data={data} updateData={updateData} showToast={showToast} />}
                        {view === 'profile' && <BusinessProfile profile={data.profile} updateData={updateData} showToast={showToast} />}
                        
                        {view === 'quotations' && <DocumentList type="qt" data={data} setView={setView} setActiveItem={setActiveItem} updateData={updateData} showToast={showToast} />}
                        {view === 'quote-form' && <DocumentForm type="qt" data={data} updateData={updateData} showToast={showToast} setView={setView} activeItem={activeItem} />}
                        {view === 'quote-preview' && <DocumentPreview type="qt" doc={activeItem} data={data} setView={setView} setActiveItem={setActiveItem} updateData={updateData} showToast={showToast} />}
                        
                        {view === 'invoices' && <DocumentList type="inv" data={data} setView={setView} setActiveItem={setActiveItem} updateData={updateData} showToast={showToast} />}
                        {view === 'invoice-form' && <DocumentForm type="inv" data={data} updateData={updateData} showToast={showToast} setView={setView} activeItem={activeItem} />}
                        {view === 'invoice-preview' && <DocumentPreview type="inv" doc={activeItem} data={data} setView={setView} setActiveItem={setActiveItem} updateData={updateData} showToast={showToast} />}
                    </main>

                    {/* Minimal Footer */}
                    <footer className="bg-slate-50 border-t border-slate-200 py-6 mt-8 no-print text-center text-slate-500 text-sm hidden md:block">
                        <AppLogo className="justify-center mb-2 grayscale opacity-50 scale-75" />
                        <p>Professional Quotations & Invoices</p>
                        <p className="mt-1">&copy; {new Date().getFullYear()} QuoteFlow. All rights reserved.</p>
                    </footer>

                    {/* Mobile Bottom Navigation Bar */}
                    <div className="md:hidden fixed bottom-safe left-4 right-4 z-50 no-print shadow-[0_8px_30px_rgb(0,0,0,0.12)]">
                        <div className="bg-[#1e293b] rounded-full px-2 py-2 flex justify-between items-center relative shadow-lg">
                            {navItems.map(item => {
                                const isActive = view === item.id || (view.startsWith(item.id.replace('s','')) && item.id !== 'dashboard');
                                return (
                                    <button 
                                        key={item.id}
                                        onClick={() => navigate(item.id)}
                                        className="flex flex-col items-center justify-center flex-1 py-1 relative"
                                    >
                                        <div className={`w-12 h-8 rounded-full flex items-center justify-center transition-colors duration-200 ${isActive ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                            <i className={`fa-solid ${item.icon} text-lg`}></i>
                                        </div>
                                        <span className={`text-[10px] mt-1 font-medium ${isActive ? 'text-white' : 'text-slate-400'}`}>{item.label}</span>
                                    </button>
                                );
                            })}
                            
                            {/* More Button */}
                            <button 
                                onClick={() => setIsMobileMenuOpen(true)}
                                className="flex flex-col items-center justify-center flex-1 py-1"
                            >
                                <div className={`w-12 h-8 rounded-full flex items-center justify-center transition-colors duration-200 ${['customers', 'profile'].includes(view) ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                    <i className="fa-solid fa-ellipsis text-lg"></i>
                                </div>
                                <span className={`text-[10px] mt-1 font-medium ${['customers', 'profile'].includes(view) ? 'text-white' : 'text-slate-400'}`}>More</span>
                            </button>
                        </div>
                    </div>

                    {/* Mobile Bottom Sheet (More Menu) */}
                    {isMobileMenuOpen && (
                        <div className="md:hidden fixed inset-0 z-[60] no-print">
                            {/* Backdrop */}
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}></div>
                            
                            {/* Sheet */}
                            <div className="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-xl transform transition-transform pb-safe">
                                <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto my-3"></div>
                                <div className="p-4 flex flex-col gap-2">
                                    <button onClick={() => navigate('customers')} className="flex items-center gap-4 p-4 rounded-xl active:bg-slate-50 text-left">
                                        <div className="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"><i className="fa-solid fa-users"></i></div>
                                        <div>
                                            <p className="font-semibold text-slate-900">Customers</p>
                                            <p className="text-xs text-slate-500">Manage client details</p>
                                        </div>
                                    </button>
                                    <button onClick={() => navigate('profile')} className="flex items-center gap-4 p-4 rounded-xl active:bg-slate-50 text-left">
                                        <div className="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center"><i className="fa-solid fa-building"></i></div>
                                        <div>
                                            <p className="font-semibold text-slate-900">Business Profile</p>
                                            <p className="text-xs text-slate-500">Company logo and details</p>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Global Toast */}
                    <Toast message={toastMessage} type={toastType} onClose={() => setToastMessage('')} />
                </div>
            );
        };

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
